# ぷよぷよテトリス2 テトリス vs テトリス のルール
#
# 「暫定」と書いた値は実機で確認できていない(設計書 docs/DESIGN.md の4章)。
# 確認できたら値を直し、コメントの「暫定」を外すこと。

name = "ぷよぷよテトリス2 テトリス vs テトリス"

# ミノの出現位置(中心)。x は左から0、y は下から0。可視20行の1つ上(21段目)に出る。
[spawn]
x = 4
y = 19

# 攻撃量(送るおじゃまの行数)
# 出典: https://tetris.wiki/PPT
[attack]
single = 0
double = 1
triple = 2
tetris = 4
tspin_mini_single = 0   # 暫定: 「ミニは加算なし」と読める記述からシングルと同じにしている
tspin_mini_double = 1   # 暫定: 同上(ダブルと同じ)
tspin_single = 2
tspin_double = 4
tspin_triple = 6
back_to_back_bonus = 1
perfect_clear = 10      # 暫定: ライン消去の攻撃量に置き換わる扱い(B2B・RENは別に加算)

# RENの攻撃量。添字がREN数(0=RENなし(1回目)、1=1REN(2回目に続けて消した時))。
# 表より長いRENは最後の値を使う(11REN以降は1手ごとに5段)。
# 確認済み(2026-10-20、ユーザー): 0REN〜10REN が 0,0,1,1,2,2,3,3,4,4,5段、11REN以降は1手ごとに5段
combo = [0, 0, 1, 1, 2, 2, 3, 3, 4, 4, 5]

# おじゃまの扱い(設計書 4.2 の要確認項目。対戦シミュレーター(M3)で使う)
[garbage]
# 1回のミノ固定でせり上がる行数の上限(0 は上限なし)。
# 以前はユーザーの記憶の7段(2026-10-20、「おそらく」)にしていた。2026-11-08、実機ログ(11/7〜11/8 の全自動)で、予告が
# 8〜11行の時に1手でその全部がせり上がった場面が多数あった(10行→10行 7件、11行→11行 1件)。7段の上限は無い。
# 12行以上の予告は記録に無く、さらに上の上限があるかは未確認なので、上限なしにしている
max_rise_per_piece = 0
# 1回の攻撃の中で穴の列が変わるか。暫定(ユーザーも不明。実機で要確認)
hole_changes_within_attack = false
# 1回の攻撃の中で、次の行も同じ穴の列にする確率(1 なら攻撃の中は同じ列)。
# 2026-11-09(ユーザー「実機に合わせる」): 実機の盤面 2,917 個で、同じ穴の列が続いた行数は 1行 6834・2行 3585・3行 1671・
# 4行 834・5行 368 回と1行ごとに約半分。選び直しても10分の1で同じ列になり、攻撃の切れ目でも列が変わるので、0.5 で近い
hole_keep_chance = 0.5
# 攻撃が届くまでの時間差(ミノ数換算)。確認済み(2026-10-20、ユーザー): 1手分くらい
delay_pieces = 1
# REN 中(ラインを消し続けている間)の攻撃はゲージにため、ラインを消さないミノを置いた時点で
# まとめて送るか。出典: 攻略wiki VSページ・tetris.wiki。false なら消した手ごとにすぐ送る
send_after_ren_ends = true
# 攻撃を自分への予告の打ち消し(相殺)に先に使うか。
# 確認済み(2026-10-20、ユーザー): REN 中も、消すたびに生まれた攻撃がすぐ予告を打ち消す
cancel_incoming_first = true
# ラインを消した手(REN の途中を含む)でも、相殺しきれなかった予告がせり上がるか。
# 確認済み(2026-11-08、ユーザー): REN 中もせり上がる。以前のシミュレーターは消さない手だけでせり上げていたので、
# C4W を積んだ側が REN を撃ちながら大きな攻撃を受け流せていた(実機ではテンプレの TST→TSD→パフェで C4W が潰れる)
rise_on_clear = true
