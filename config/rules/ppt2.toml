# ぷよぷよテトリス2 テトリス vs テトリス のルール
#
# 「暫定」と書いた値は実機で確認できていない(設計書 docs/DESIGN.md の4章)。
# 確認できたら値を直し、コメントの「暫定」を外すこと。

name = "ぷよぷよテトリス2 テトリス vs テトリス"

# ミノの出現位置(中心)。x は左から0、y は下から0。可視20行の1つ上(21段目)に出る。
[spawn]
x = 4
y = 20

# 攻撃量(送るおじゃまの行数)
# 出典: https://tetris.wiki/PPT
[attack]
single = 0
double = 1
triple = 2
tetris = 4
tspin_mini_single = 0   # 暫定: 「ミニは加算なし」と読める記述からシングルと同じにしている
tspin_mini_double = 1   # 暫定: 同上(ダブルと同じ)
tspin_single = 2
tspin_double = 4
tspin_triple = 6
back_to_back_bonus = 1
perfect_clear = 10      # 暫定: ライン消去の攻撃量に置き換わる扱い(B2B・RENは別に加算)

# RENの攻撃量。添字がREN数(0=RENなし、1=1REN目=2回続けて消した時)。
# 表より長いRENは最後の値を使う。
# 暫定: 出典の表が崩れていたため、ガイドラインの一般的な値を置いている。
combo = [0, 0, 1, 1, 2, 2, 3, 3, 4, 4, 4, 5]

# おじゃまの扱い(設計書 4.2 の要確認項目。対戦シミュレーター(M3)で使う)
[garbage]
# 1回のミノ固定でせり上がる行数の上限(0 は上限なし)。暫定
max_rise_per_piece = 0
# 1回の攻撃の中で穴の列が変わるか。暫定
hole_changes_within_attack = false
# 攻撃が届くまでの時間差(ミノ数換算)。暫定
delay_pieces = 1
# REN 中(ラインを消し続けている間)の攻撃はゲージにため、ラインを消さないミノを置いた時点で
# まとめて送るか。出典: 攻略wiki VSページ・tetris.wiki。false なら消した手ごとにすぐ送る
send_after_ren_ends = true
# 攻撃を自分への予告の打ち消し(相殺)に先に使うか。暫定(相殺のタイミングは要確認)
cancel_incoming_first = true
